name: Hunter
on:
  workflow_dispatch:
    inputs:
      keywords:
        description: 'JSON array'
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "trigger.json"
jobs:
  hunt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Cache playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium
      - run: pip install ddddocr playwright requests
      - run: python -m playwright install --with-deps chromium
      - name: Debug info
        run: |
          python -c "import ddddocr; print('ddddocr OK')"
          python -c "from playwright.sync_api import sync_playwright; print('playwright OK')"
      - name: Hunt
        env:
          KEYWORDS: ${{ inputs.keywords }}
          SHARD: ${{ matrix.shard }}
        run: python hunt.py 2>&1 || true
      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ matrix.shard }}
          path: |
            hits.jsonl
            *.log
      - name: Debug on failure
        if: failure()
        run: |
          echo "=== Python version ==="
          python --version
          echo "=== pip list ==="
          pip list
          echo "=== last lines of hunt output ==="
          true
